# LICHT LUXE NATURALS — Application Properties
# Made in LOVEWORLD

spring.application.name=luxe-naturals-backend

# ─── MySQL Datasource ────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/luxe_naturals_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Server ──────────────────────────────────────────────────
server.port=8080

# ─── JWT Configuration ────────────────────────────────────────
app.jwt.secret=LichtLuxeNaturalsMadeInLoveworldSecretKey2026PureNaturalMadeWithLoveJWTSigning
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── CORS (frontend running on port 3000) ────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ─── File Upload ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
