# Test Configuration for Integration Tests
spring.application.name=luxe-naturals-backend-test

# In-memory H2 Database for fast, isolated test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test Secrets
app.jwt.secret=LichtLuxeNaturalsMadeInLoveworldSecretKey2026PureNaturalMadeWithLoveJWTSigning
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

paypal.client-id=test_paypal_client_id
paypal.client-secret=test_paypal_client_secret
paypal.mode=sandbox
paypal.webhook-id=test_webhook_id

app.currency=GBP
app.shipping.standard-fee=6.99
app.shipping.express-fee=10.99
app.shipping.free-threshold=70.00
app.cors.allowed-origins=https://lichtluxenaturals.org

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Mock Mail
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@lichtluxenaturals.org
spring.mail.password=test
app.mail.from=test@lichtluxenaturals.org
app.mail.sender-name=LICHT LUXE NATURALS TEST

