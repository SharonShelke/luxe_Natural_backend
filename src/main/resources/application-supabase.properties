# ─── Supabase PostgreSQL Configuration ─────────────────────────
# LICHT LUXE NATURALS — Made in LOVEWORLD
# Usage: Run with --spring.profiles.active=supabase or set in application.properties

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.${SUPABASE_PROJECT_REF:your-project-ref}.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Titan / GoDaddy Email settings remain active across all profiles
spring.mail.host=${SPRING_MAIL_HOST:smtp.titan.email}
spring.mail.port=465
spring.mail.username=info@lichtluxenaturals.org
spring.mail.password=${MAIL_PASSWORD:${TITAN_EMAIL_PASSWORD:Luxe@123&}}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
